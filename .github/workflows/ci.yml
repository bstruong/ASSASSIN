name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Format & Test Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Check linting (Ruff)
        run: uv run ruff check .

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Run test suite with strict coverage gate (>90%)
        run: uv run pytest --cov=app --cov-fail-under=90 -v

      - name: Run mutation testing & quality score gate
        run: |
          uv run mutmut run
          uv run mutmut export-cicd-stats
          uv run python scripts/check_mutation_score.py --min-score 55.0

