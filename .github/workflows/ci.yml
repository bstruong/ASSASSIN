name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Check linting (Ruff)
      run: uv run ruff check .
    - name: Check formatting (Ruff)
      run: uv run ruff format --check .
  test:
    name: Test Coverage Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: assassin
          POSTGRES_DB: assassin_test
        ports:
        - 54329:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --tmpfs /var/lib/postgresql/data
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Initialize Test Database Schema
      env:
        PGPASSWORD: assassin
      run: psql -h localhost -p 54329 -U postgres -d assassin_test -f app/db/schema.sql
    - name: Run test suite with strict coverage gate (>90%)
      run: uv run pytest --cov=app --cov-fail-under=90 -v
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: assassin
          POSTGRES_DB: assassin_test
        ports:
        - 54329:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --tmpfs /var/lib/postgresql/data
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Initialize Test Database Schema
      env:
        PGPASSWORD: assassin
      run: psql -h localhost -p 54329 -U postgres -d assassin_test -f app/db/schema.sql
    - name: Cache mutmut
      uses: actions/cache@v4
      with:
        path: .mutmut-cache
        key: mutmut-${{ github.sha }}
        restore-keys: mutmut-
    - name: Run mutation testing & quality score gate
      run: 'uv run python scripts/run_mutation_on_diff.py

        uv run python scripts/check_mutation_score.py --min-score 55.0

        '
