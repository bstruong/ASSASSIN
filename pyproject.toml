[project]
name = "assassin"
version = "0.1.0"
description = "ASSASSIN - local financial document intelligence pipeline. Zero PII egress."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "pdfplumber>=0.11.0",
    "uvicorn>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mutmut>=3.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "reportlab>=5.0.1",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests"]
