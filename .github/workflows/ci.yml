name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Check linting (Ruff)
      run: uv run ruff check .
    - name: Check formatting (Ruff)
      run: uv run ruff format --check .
  test:
    name: Test Coverage Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: assassin
          POSTGRES_DB: assassin_test
        ports:
        - 54329:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --tmpfs /var/lib/postgresql/data
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Initialize Test Database Schema
      env:
        DATABASE_URL: postgresql://postgres:assassin@localhost:54329/assassin_test
      run: uv run python -c "from app.db.connection import init_db; init_db()"
    - name: Install Playwright browsers
      run: uv run playwright install --with-deps
    - name: Run test suite with strict coverage gate (>90%)
      run: uv run pytest --cov=app --cov-fail-under=90 -v
  # Mutation testing moved to .github/workflows/mutation-nightly.yml
  # (schedule + main path pushes + workflow_dispatch). PRs are not blocked by mutmut.
