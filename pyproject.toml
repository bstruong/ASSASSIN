[project]
name = "assassin"
version = "0.1.0"
description = "ASSASSIN - local financial document intelligence pipeline. Zero PII egress."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "pdfplumber>=0.11.0",
    "uvicorn>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.18",
    "pytest-playwright>=0.9.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mutmut>=3.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "reportlab>=5.0.1",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mutmut]
# Single source of truth for mutmut 3.x (do not maintain a parallel setup.cfg).
# source_paths must stay ["app"] so the full package is copied into mutants/.
# Diff-scoped runs inject only_mutate via scripts/run_mutation_on_diff.py.
source_paths = ["app"]
pytest_add_cli_args = [
    "-x",
    "-q",
    "--ignore=tests/test_e2e_dashboard.py",
    # Meta-tests of mutation gate scripts load scripts/ from repo root; mutmut
    # only copies app/ into mutants/, so these must not run under mutmut.
    "--ignore=tests/test_mutation_gates.py",
    # Out-of-scope layers: mutating them is disabled; their tests can fail
    # preflight when optional services (GPU MCP, etc.) are absent.
    "--ignore=tests/routers",
    "--ignore=tests/mcp",
]
pytest_add_cli_args_test_selection = ["tests"]
# Presentation / orchestration glue is out of financial mutation scope.
do_not_mutate = [
    "app/api/*",
    "app/mcp/*",
    "app/routers/*",
    "app/middleware/*",
    "app/core/*",
]
