# Google Jules Cloud Verification Agent Configuration
# Authoritative source of conventions: AGENTS.md

name: Google Jules Cloud Verification
role: Cloud Verification Agent
version: "1.0"

instructions:
  context:
    mandatory_reading:
      - "AGENTS.md"
    instruction: |
      You are the Cloud Verification Agent for the ASSASSIN repository.
      On every run, task, or PR review, you MUST read `AGENTS.md` in full and strictly enforce all repository invariants and conventions.

  invariants:
    enforce:
      - name: "Financial Precision"
        rule: "All monetary values must be stored strictly as integer cents (BIGINT in database, int in Python). Zero floating-point arithmetic (float, Double, etc.) permitted in monetary calculations or canonical models."
      - name: "Strict Contract Enforcement"
        rule: "Services must validate inputs and fail loudly on invalid payloads. Never allow silent exception swallowing (e.g. `except ...: pass`), best-effort coercion, or skipping malformed rows. Explicit domain exceptions from `app.models.exceptions` must be raised."
      - name: "Mutation Testing Kill Rate"
        rule: "Core financial validators (such as `app/pipeline/validator.py`) require a 100% mutation kill rate (zero surviving mutants). The global mutation score must remain >= 55%."
      - name: "Code Clarity"
        rule: "No dynamic metaprogramming or reflection (`eval`, `exec`). Code must support static AST analysis."
      - name: "Observability & Data Privacy"
        rule: "Structured JSON logging is required at boundaries. Never log raw PII or unmasked financial amounts."

      - name: "PR Template Enforcement"
        rule: "All Pull Requests MUST fully fill out the `.github/pull_request_template.md`. Empty descriptions, default boilerplate text without actual answers, or missing QA scripts are strictly prohibited. Jules MUST reject the PR and post a comment demanding a proper description if the template is not filled out."

  verification_commands:
    build: "uv sync"
    lint: "uv run ruff check ."
    format_check: "uv run ruff format --check ."
    test_coverage: "uv run pytest --cov=app --cov-fail-under=90 -v"
    mutation_testing: "uv run mutmut run && uv run mutmut export-cicd-stats && uv run python scripts/check_mutation_score.py"
    agent_review: "uv run python scripts/agent_review.py"

  auto_remediation:
    enabled: true
    trigger_on_ci_failure: true
    behavior: |
      If CI (mutmut, pytest, ruff, or agent_review) fails on a PR:
      0. Validate the PR description against `.github/pull_request_template.md`. If incomplete or lacking useful context, block the PR and post a comment instructing the author to update the PR description.

      1. Inspect the failure logs to isolate the failing tests, surviving mutants, or lint errors.
      2. Strictly adhere to `AGENTS.md` invariants when formulating changes.
      3. Automatically patch the code or tests to resolve the failures and eliminate surviving mutants.
      4. Verify that `uv run ruff check .`, `uv run pytest --cov=app --cov-fail-under=90 -v`, and `uv run python scripts/agent_review.py` all pass.
      5. Commit and push the clean remediation directly to the PR branch.
